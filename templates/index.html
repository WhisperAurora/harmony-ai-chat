<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鸿蒙知识 AI 对话助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message { margin-bottom: 15px; display: flex; }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; }
        .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; word-wrap: break-word; }
        .user .bubble { background: #667eea; color: white; border-bottom-right-radius: 4px; }
        .ai .bubble { background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-area { padding: 15px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; }
        #userInput { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        #userInput:focus { border-color: #667eea; }
        button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { background: #5568d3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .clear-btn { background: #f56c6c; }
        .clear-btn:hover { background: #e74c3c; }
        .loading { color: #999; font-style: italic; }
        .quick-questions { padding: 10px 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .quick-questions span { display: inline-block; background: #e8eaf6; color: #667eea; padding: 5px 12px; border-radius: 15px; font-size: 12px; margin: 3px; cursor: pointer; }
        .quick-questions span:hover { background: #c5cae9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>鸿蒙知识 AI 对话助手</h1>
        <p>基于大模型的鸿蒙技术问答 · 面试演示项目</p>
    </div>
    
    <div class="quick-questions">
        <span onclick="quickAsk('什么是鸿蒙北向应用开发？')">什么是鸿蒙北向应用开发？</span>
        <span onclick="quickAsk('OpenHarmony 和 HarmonyOS 有什么区别？')">OpenHarmony 和 HarmonyOS 区别？</span>
        <span onclick="quickAsk('ArkTS 是什么？')">ArkTS 是什么？</span>
        <span onclick="quickAsk('鸿蒙元服务是什么？')">鸿蒙元服务是什么？</span>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="bubble">你好！我是鸿蒙知识 AI 助手，可以回答关于开源鸿蒙、HarmonyOS 的技术问题。有什么想了解的吗？</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()" id="sendBtn">发送</button>
        <button class="clear-btn" onclick="clearChat()">清空</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            document.getElementById('sendBtn').disabled = true;

            const loadingId = addMessage('正在思考...', 'ai', true);

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById(loadingId).remove();
                addMessage(data.reply, 'ai');
                document.getElementById('sendBtn').disabled = false;
            })
            .catch(err => {
                document.getElementById(loadingId).remove();
                addMessage('抱歉，出错了，请重试。', 'ai');
                document.getElementById('sendBtn').disabled = false;
            });
        }

        function addMessage(text, role, isLoading = false) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            if (isLoading) {
                const id = 'loading-' + Date.now();
                div.id = id;
                div.innerHTML = '<div class="bubble loading">' + text + '</div>';
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
                return id;
            }
            div.innerHTML = '<div class="bubble">' + text.replace(/\n/g, '<br>') + '</div>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            fetch('/clear', { method: 'POST' })
            .then(() => {
                document.getElementById('chatContainer').innerHTML = 
                    '<div class="message ai"><div class="bubble">对话已清空，有什么新问题吗？</div></div>';
            });
        }

        function quickAsk(question) {
            document.getElementById('userInput').value = question;
            sendMessage();
        }
    </script>
</body>
</html>
